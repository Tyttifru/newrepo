<!DOCTYPE html>
<html>
    <head lang="en">
        <meta charset="UTF-8">
        <title>Добро пожаловать в чат!</title>
    <link href="style.css" rel="stylesheet"></head>
    <body>
        <form class="form" action="/">
            <div class="message"></div>
            <div class="form-row">
                <input class="author-input" name="author" placeholder="Имя" type="text">
                <input class="form-input" name="message-text" placeholder="Введите сообщение" type="text">
                <button class="clearbtn" type="button" title="Очистить чат">
                    <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <polyline points="3 6 5 6 21 6"></polyline>
                    <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path>
                    <line x1="10" y1="11" x2="10" y2="17"></line>
                    <line x1="14" y1="11" x2="14" y2="17"></line>
                </svg>
                </button>
                <button class="sendbtn" type="submit" title="Отправить сообщение"><svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <line x1="22" y1="2" x2="11" y2="13"></line>
                    <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
                </svg>
                </button>
            </div>
        </form>
        <script type="module" src="/simple-chat/src/index.js"></script>
    <script type="text/javascript" src="bundle.js"></script></body>
</html>
