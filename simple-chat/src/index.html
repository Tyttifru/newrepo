<!DOCTYPE html>
<html lang="ru">

<head>
	<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" />
	<meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Добро пожаловать в чат "VK Школята"</title>
	<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Ccircle cx='12' cy='12' r='12' fill='%230077FF'/%3E%3Cpath d='M12.785 16.241s.288-.032.436-.194c.136-.148.132-.427.132-.427s-.02-1.304.576-1.496c.588-.19 1.341 1.26 2.14 1.817.604.421 1.063.329 1.063.329l2.134-.03s1.116-.07.587-.965c-.043-.073-.308-.661-1.588-1.87-1.34-1.264-1.16-1.059.453-3.246 1.585-2.14 1.958-2.506 1.958-2.506s.323-.553-.232-.553h-2.42s-.25-.035-.436.13c-.182.162-.298.546-.298.546s-.783 2.07-1.824 3.772c-1.09 1.78-1.53 1.875-1.708 1.763-.417-.27-.313-1.083-.313-1.662 0-1.806.287-2.56-.556-2.756-.28-.065-.485-.107-1.198-.115-.915-.01-1.688.003-2.126.217-.292.143-.516.462-.38.48.17.023.555.105.758.383.26.356.252 1.158.252 1.158s.15 2.13-.35 2.394c-.342.18-.81-.187-1.816-1.86-.514-.878-.904-1.849-.904-1.849s-.15-.376-.42-.476c-.323-.122-.774-.13-.774-.13H4.18s-.607.017-.807.282c-.178.237-.014.727-.014.727s1.316 3.098 2.805 4.668c1.366 1.442 2.917 1.347 2.917 1.347h1.156z' fill='%23ffffff'/%3E%3C/svg%3E">
</head>

<body>
	<header class="vk-header">
		<div class="vk-logo">
			<svg xmlns="http://www.w3.org/2000/svg" width="60" height="60" viewBox="0 0 24 24" fill="#ffffff">
				<path d="M12.785 16.241s.288-.032.436-.194c.136-.148.132-.427.132-.427s-.02-1.304.576-1.496c.588-.19 1.341 1.26 2.14 1.817.604.421 1.063.329 1.063.329l2.134-.03s1.116-.07.587-.965c-.043-.073-.308-.661-1.588-1.87-1.34-1.264-1.16-1.059.453-3.246 1.585-2.14 1.958-2.506 1.958-2.506s.323-.553-.232-.553h-2.42s-.25-.035-.436.13c-.182.162-.298.546-.298.546s-.783 2.07-1.824 3.772c-1.09 1.78-1.53 1.875-1.708 1.763-.417-.27-.313-1.083-.313-1.662 0-1.806.287-2.56-.556-2.756-.28-.065-.485-.107-1.198-.115-.915-.01-1.688.003-2.126.217-.292.143-.516.462-.38.48.17.023.555.105.758.383.26.356.252 1.158.252 1.158s.15 2.13-.35 2.394c-.342.18-.81-.187-1.816-1.86-.514-.878-.904-1.849-.904-1.849s-.15-.376-.42-.476c-.323-.122-.774-.13-.774-.13H4.18s-.607.017-.807.282c-.178.237-.014.727-.014.727s1.316 3.098 2.805 4.668c1.366 1.442 2.917 1.347 2.917 1.347h1.156z" />
			</svg>
		</div>
		<div class="vk-title">Школята мессенджер</div>
		<button class="logoutbtn" type="button" title="Выйти">
			<span class="material-symbols-outlined">logout</span>
		</button>
	</header>

	<div class="screen active" id="login-screen">
        <div class="flip-card">
            <div class="flip-card-inner" id="auth-flip">
                <div class="flip-card-front">
                    <form class="login-box" id="login-form">
                        <h2>Вход в чат</h2>
                        <input class="author-input" id="login-name" placeholder="Введите ваше имя" type="text">
                        <input class="password-input" id="login-password" placeholder="Введите пароль" type="password">
                        <button class="login-btn" type="submit">Войти</button>
                        <h3>Нет аккаунта?</h3>
                        <button class="registration-btn" id="to-register-btn" type="button">Регистрация</button>
                    </form>
                </div>

                <div class="flip-card-back">
                    <form class="login-box" id="register-form">
                        <h2>Регистрация</h2>
                        <input class="author-input" id="reg-name" placeholder="Введите ваше имя" type="text">
                        <input class="password-input" id="reg-password" placeholder="Введите пароль" type="password">
                        <button class="addnewuser-btn" type="submit">Зарегистрироваться</button>
                        <button class="backtologin-btn" id="back-to-login-btn" type="button">Назад</button>
                    </form>
		        </div>
	        </div>
        </div>
    </div>

	<div class="screen" id="chat-list-screen">
		<div class="chat-list-box">
			<div class="burger-menu-wrapper">
				<button class="burger-btn" type="button" title="Меню">
					<span class="material-symbols-outlined">menu</span>
				</button>

				<div class="dropdown-menu" id="burger-dropdown">
					<button class="dropdown-item" type="button">
						<span class="material-symbols-outlined">contacts</span>
						<span>Контакты</span>
					</button>
					<button class="dropdown-item" type="button">
						<span class="material-symbols-outlined">settings</span>
						<span>Настройки</span>
					</button>
				</div>
			</div>

			<div class="search-container" id="search-container">
				<input type="text" class="search-input" placeholder="Поиск...">

				<button class="search-btn" id="search-btn" type="button" title="Поиск">
					<span class="material-symbols-outlined">search</span>
				</button>
			</div>

			<div class="chat-list-container">

            </div>

			<button class="fab-btn" type="button" title="Создать чат">
				<span class="material-symbols-outlined">add_circle</span>
			</button>
		</div>
	</div>
    
	<div class="chat screen" id="chat-screen">
		<form class="form" action="/">
			<button class="back-to-list-btn" type="button" title="Назад к списку">
				<span class="material-symbols-outlined">arrow_back</span>
			</button>

			<div class="chat-top-actions">
				<div class="search-container" id="chat-search-container">
					<input type="text" class="search-input" id="chat-search-input" placeholder="Поиск в чате...">
					<button class="search-btn" type="button" id="chat-search-btn">
						<span class="material-symbols-outlined">search</span>
					</button>
				</div>

				<div class="burger-menu-wrapper">
					<button class="chat-burger-btn" type="button" title="Меню чата">
						<span class="material-symbols-outlined">menu</span>
					</button>

					<div class="dropdown-menu" id="chat-dropdown" style="right: 0; left: auto;">
						<button class="dropdown-item" id="clear-chat-btn" type="button">
							<span class="material-symbols-outlined">delete</span>
							<span>Очистить чат</span>
						</button>
					</div>
				</div>
			</div>
			<div class="message"></div>
			<div class="form-row">

				<input class="form-input" name="message-text" placeholder="Введите сообщение" type="text" maxlength="350">

				<button class="sendbtn" type="submit" title="Отправить сообщение">
					<span class="material-symbols-outlined">send</span>>
				</button>
			</div>
		</form>
	</div>
	<script type="module" src="/simple-chat/src/index.js"></script>
</body>

</html>
